<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Abdulkarim Alshudukhi — terminal profile card</title>
  <desc id="heroDesc">Animated terminal window on a near-black background. It reads: whoami returns Abdulkarim Alshudukhi, Android and platform. A dumpsys-style summary lists Software Engineering at the University of Ha'il, 6 Android products with 1 live on Google Play, 14,000+ downloads and 79 GitHub stars, a Kotlin, Compose, LSPosed, Zygisk and AIDL focus, and availability for a co-op starting January 2027.</desc>

  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#161616"/>
    </pattern>
    <clipPath id="cardClip">
      <rect width="1280" height="380" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1280" height="380" fill="#050505"/>
    <rect width="1280" height="380" fill="url(#dotGrid)"/>

    <!-- window chrome -->
    <rect width="1280" height="52" fill="#0A0A0A"/>
    <line x1="0" y1="52" x2="1280" y2="52" stroke="#1A1A1A" stroke-width="1"/>
    <circle cx="30" cy="26" r="6.5" fill="#FF5F57"/>
    <circle cx="52" cy="26" r="6.5" fill="#FEBC2E"/>
    <circle cx="74" cy="26" r="6.5" fill="#28C840"/>
    <text x="640" y="31" text-anchor="middle" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" letter-spacing="0.5" fill="#8A8A8A">abdulkarim@android — zsh</text>

    <!-- watermark + accent rule -->
    <text x="1258" y="212" text-anchor="end" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="100" font-weight="700" fill="#00B13F" opacity="0.06">kvmy666</text>
    <line x1="812" y1="88" x2="812" y2="292" stroke="#00B13F" stroke-width="1" opacity="0.28"/>

    <!-- terminal transcript -->
    <g font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="21">

      <g opacity="0">
        <text x="72" y="108" fill="#00B13F">$ whoami</text>
        <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="72" y="142" font-size="24" fill="#FFFFFF">Abdulkarim Alshudukhi — Android &amp; Platform</text>
        <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="72" y="186" fill="#00B13F">$ adb shell dumpsys me</text>
        <animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="72" y="220" fill="#7A7A7A">role</text>
        <text x="210" y="220" fill="#E5E5E5">Software Engineering @ University of Ha'il</text>
        <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="72" y="254" fill="#7A7A7A">shipped</text>
        <text x="210" y="254" fill="#E5E5E5">6 Android products · 1 live on Google Play</text>
        <animate attributeName="opacity" from="0" to="1" begin="1.45s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="72" y="288" fill="#7A7A7A">reach</text>
        <text x="210" y="288" fill="#E5E5E5">14,000+ downloads · 79★ on GitHub</text>
        <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="72" y="322" fill="#7A7A7A">focus</text>
        <text x="210" y="322" fill="#E5E5E5">Kotlin · Compose · LSPosed / Zygisk / AIDL</text>
        <animate attributeName="opacity" from="0" to="1" begin="1.95s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="72" y="356" fill="#7A7A7A">status</text>
        <text x="210" y="356" fill="#00B13F">open to co-op — Jan 2027</text>
        <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.32s" fill="freeze"/>
      </g>
    </g>

    <!-- blinking block cursor -->
    <rect x="512" y="338" width="11" height="20" fill="#00B13F">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="379" rx="17.5" fill="none" stroke="#1A1A1A" stroke-width="1"/>
</svg>
