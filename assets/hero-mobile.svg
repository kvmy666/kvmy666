<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-labelledby="heroMobileTitle heroMobileDesc">
  <title id="heroMobileTitle">Abdulkarim Alshudukhi — terminal profile card</title>
  <desc id="heroMobileDesc">Animated terminal window on a near-black background. It reads: whoami returns Abdulkarim Alshudukhi, Android and platform. A dumpsys-style summary lists Software Engineering at the University of Ha'il, 6 products with 1 live on Google Play, 14,000+ downloads and 79 GitHub stars, a Kotlin, Compose and LSPosed focus, and availability for a co-op starting January 2027.</desc>

  <defs>
    <pattern id="dotGridMobile" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#161616"/>
    </pattern>
    <clipPath id="cardClipMobile">
      <rect width="640" height="470" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClipMobile)">
    <rect width="640" height="470" fill="#050505"/>
    <rect width="640" height="470" fill="url(#dotGridMobile)"/>

    <!-- window chrome -->
    <rect width="640" height="44" fill="#0A0A0A"/>
    <line x1="0" y1="44" x2="640" y2="44" stroke="#1A1A1A" stroke-width="1"/>
    <circle cx="24" cy="22" r="5.5" fill="#FF5F57"/>
    <circle cx="42" cy="22" r="5.5" fill="#FEBC2E"/>
    <circle cx="60" cy="22" r="5.5" fill="#28C840"/>
    <text x="320" y="26" text-anchor="middle" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" letter-spacing="0.5" fill="#8A8A8A">abdulkarim@android — zsh</text>

    <!-- watermark -->
    <text x="620" y="446" text-anchor="end" font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="56" font-weight="700" fill="#00B13F" opacity="0.06">kvmy666</text>

    <!-- terminal transcript -->
    <g font-family="'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="21">

      <g opacity="0">
        <text x="40" y="84" fill="#00B13F">$ whoami</text>
        <animate attributeName="opacity" from="0" to="1" begin="0.12s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="40" y="117" font-size="24" fill="#FFFFFF">Abdulkarim Alshudukhi</text>
        <animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="40" y="150" fill="#00B13F">Android &amp; Platform</text>
        <animate attributeName="opacity" from="0" to="1" begin="0.72s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="40" y="183" fill="#00B13F">$ adb shell dumpsys me</text>
        <animate attributeName="opacity" from="0" to="1" begin="1.02s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="40" y="216" fill="#7A7A7A">role</text>
        <text x="152" y="216" fill="#E5E5E5">Software Engineering @ U of Ha'il</text>
        <animate attributeName="opacity" from="0" to="1" begin="1.28s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="40" y="249" fill="#7A7A7A">shipped</text>
        <text x="152" y="249" fill="#E5E5E5">6 products · 1 live on Play</text>
        <animate attributeName="opacity" from="0" to="1" begin="1.54s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="40" y="282" fill="#7A7A7A">reach</text>
        <text x="152" y="282" fill="#E5E5E5">14,000+ downloads · 79★</text>
        <animate attributeName="opacity" from="0" to="1" begin="1.80s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="40" y="315" fill="#7A7A7A">focus</text>
        <text x="152" y="315" fill="#E5E5E5">Kotlin · Compose · LSPosed</text>
        <animate attributeName="opacity" from="0" to="1" begin="2.06s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="40" y="348" fill="#00B13F">$ status</text>
        <animate attributeName="opacity" from="0" to="1" begin="2.32s" dur="0.32s" fill="freeze"/>
      </g>

      <g opacity="0">
        <text x="40" y="381" fill="#00B13F">open to co-op — Jan 2027</text>
        <animate attributeName="opacity" from="0" to="1" begin="2.58s" dur="0.32s" fill="freeze"/>
      </g>
    </g>

    <!-- blinking block cursor -->
    <rect x="348" y="364" width="10" height="20" fill="#00B13F">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="639" height="469" rx="15.5" fill="none" stroke="#1A1A1A" stroke-width="1"/>
</svg>
